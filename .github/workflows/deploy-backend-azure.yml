name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name acrragappdylan

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker build \
            -t acrragappdylan.azurecr.io/rag-backend:${{ github.sha }} \
            -t acrragappdylan.azurecr.io/rag-backend:latest \
            ./backend

          docker push acrragappdylan.azurecr.io/rag-backend:${{ github.sha }}
          docker push acrragappdylan.azurecr.io/rag-backend:latest

      - name: Deploy revision to Azure Container Apps
        run: |
          az containerapp update \
            --name rag-backend \
            --resource-group rg-rag-spain \
            --image acrragappdylan.azurecr.io/rag-backend:${{ github.sha }}
