# ── RAG App — Docker Compose ────────────────────────────────────────────────
#
# Prerequisites: copy .env.example to .env and fill in your values.
#
# ── Quick start with Groq ────────────────────────────────────────────────────
#   Set GROQ_API_KEY in .env, then:
#   docker compose up --build
#
# Services:
#   backend   — FastAPI RAG API  (http://localhost:8000)
#   frontend  — React app via Nginx (http://localhost:3000)
#
# ---------------------------------------------------------------------------

services:

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - EXTRA_CORS_ORIGINS=${EXTRA_CORS_ORIGINS:-}
    volumes:
      # Mount chroma_db so it persists and can be pre-built outside Docker
      - ./backend/rag_pipeline/chroma_db:/app/rag_pipeline/chroma_db
      # Mount the source PDF document
      - ./backend/rag_pipeline/documents:/app/rag_pipeline/documents
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── React Frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string = relative URL, nginx proxies /ask → backend:8000/ask
        VITE_API_URL: ""
    container_name: rag_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
